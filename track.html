<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تتبع الطلب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="logo.png" class="logo">
</header>

<div class="confirm-box">
    <h2>تتبع طلبك</h2>

    <input id="trackInput" type="text" placeholder="ادخل رقم الطلب">
    <button onclick="track()">بحث</button>

    <p id="result" style="margin-top:20px; font-size:20px;"></p>
</div>

<script>
function track() {
    const order = document.getElementById("trackInput").value;

    if(order === "1001") {
        document.getElementById("result").innerText = "الحالة: قيد التحضير ❤";
    } else if(order === "1002") {
        document.getElementById("result").innerText = "الحالة: في الطريق 🚗🔥";
    } else {
        document.getElementById("result").innerText = "رقم الطلب غير موجود";
    }
}
</script>

</body>
</html>
