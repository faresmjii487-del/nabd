<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تأكيد الطلب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>تأكيد الطلب</header>
<header>
    <img src="nbd.jpg" class="logo">
</header>
<div class="confirm-box">
    <h2 id="item"></h2>
    <h3 id="price"></h3>

    <p>تم استلام طلبك ❤  
    سيتم التواصل معك قريباً.</p>

    <a class="btn" href="index.html">العودة للصفحة الرئيسية</a>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("item").innerText = "المنتج: " + params.get("item");
    document.getElementById("price").innerText = "السعر: " + params.get("price") + " د.ك";
</script>

</body>
</html>
